DISTAN · ÉCOLE RUNAKY", "count": 33, "total": 34}, {"src": "art_068.jpg", "group": "KURDISTAN · ÉCOLE RUNAKY", "count": 34, "total": 34}];const intro=["À l’École primaire Runaky de Bakrajo, à Souleimaniye (Région du Kurdistan, Irak), j’ai enseigné les arts plastiques pendant trois ans à des enfants de 6 à 12 ans. Cette école relevait du ministère de l’Éducation du Gouvernement régional du Kurdistan. Les œuvres de mes élèves ont été présentées lors d’une exposition scolaire en avril. Dès 2009, j’ai également introduit le Zentangle auprès des élèves de 10 à 12 ans.", "La même année, Mme Nancy Baack, enseignante d’arts plastiques à Glidden–Ralston Community School (Iowa, États-Unis), nous a proposé un échange international de dessins. Ses élèves étudiaient l’art à travers le monde et souhaitaient découvrir d’autres cultures, paysages et façons de vivre. Nous avons reçu environ 30 œuvres d’enfants américains, accompagnées de textes personnels, et avons répondu avec plus de 30 créations de nos élèves.", "Mme Baack m’a ensuite écrit pour remercier notre école et saluer le talent de chaque enfant. Afin de prolonger ce dialogue, j’ai contacté le centre culturel Sardam, éditeur d’un magazine mensuel pour enfants. Il a accepté de publier, dans chaque numéro, quatre œuvres des élèves américains avec leurs textes et quatre œuvres de nos élèves, permettant aux enfants des deux pays de se découvrir à travers leur propre langage artistique.", "Ce projet a encouragé l’expression libre, la confiance, l’amitié et la compréhension interculturelle. Les dessins ne sont pas de simples illustrations : ils témoignent des regards des enfants sur leur famille, leur environnement, leurs rêves et leur quotidien."];let n=0,playing=true;const m=document.getElementById('main'),audio=document.getElementById('audio');let timer;function render(){if(n===0)m.innerHTML='<h1>L’ART AU-DELÀ DES FRONTIÈRES</h1><h2>Échange artistique entre enfants du Kurdistan et des États-Unis — 2009</h2><div class="intro" (()=>{const c=document.getElementById('birds'),ctx=c.getContext('2d');let W,H,dpr=1,t=0;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();const birds=Array.from({length:350},(_,i)=>({phase:Math.random()*6.28,r:Math.random(),speed:.6+Math.random()*.8,sz:1+Math.random()*1.6}));function frame(){t+=.009;ctx.clearRect(0,0,W,H);for(let i=0;i<birds.length;i++){let b=birds[i];let u=i/birds.length;let a=u*12.566+t*b.speed+b.phase*.13;let shape=Math.sin(t*.35)*.5+.5;let x=W*(.5+(.40+.07*Math.sin(t*.2))*Math.sin(a)*(.40+.6*b.r))+Math.sin(a*2+t)*W*.05;let y=H*(.5+(.24+.07*shape)*Math.cos(a*1.35)*(.35+.65*b.r))+Math.cos(a*3-t)*H*.045;ctx.strokeStyle='rgba(70,31,16,.58)';ctx.lineWidth=.75;ctx.beginPath();ctx.moveTo(x-b.sz*2,y-b.sz);ctx.lineTo(x,y);ctx.lineTo(x+b.sz*2,y-b.sz);ctx.stroke()}requestAnimationFrame(frame)}frame()})();
